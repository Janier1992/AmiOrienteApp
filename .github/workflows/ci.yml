name: CI

# Revisa cada cambio antes de fusionarlo (el despliegue solo corre al llegar a main).
on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Compilación
        run: npm run build
        env:
          # Valores de relleno: la compilación no se conecta a Supabase.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci
      - name: Alertas de seguridad en dependencias de producción
        # Bloquea si aparece una vulnerabilidad alta o crítica en lo que llega a producción.
        run: npm audit --omit=dev --audit-level=high

  base-de-datos:
    # Prueba las migraciones SQL (permisos, pedidos, cancelación, domiciliarios) contra un
    # PostgreSQL desechable; nunca toca el Supabase real.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Pruebas de base de datos
        run: bash tools/db-test/run.sh

  secretos:
    # Busca claves o credenciales subidas por error al repositorio.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
