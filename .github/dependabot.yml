version: 2
updates:
  # Dependencias de la aplicación: un solo pull request semanal con las actualizaciones menores y de parche.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    # Las versiones mayores (por ejemplo react-router 7, vite 5) se planifican a mano, no automáticamente.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
